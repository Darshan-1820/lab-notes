<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Engineering Lab: lessons and notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  /* One reading column for a phone held in one hand. Home lists everything; one lesson or note per screen. */
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --panel2: #e9edf3; --line: #cfd7e3; --code: #eef1f6;
    --text: #17202b; --dim: #566376; --accent: #0b8f5a; --accent-ink: #ffffff;
    --blue: #1f5fbf; --warn: #a45a00; --bad: #c0392b; --on-bad: #ffffff;
    --sans: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171c25; --panel2: #1e2531; --line: #2b3444; --code: #0b0e13;
      --text: #e7ecf3; --dim: #97a3b6; --accent: #5ee0a0; --accent-ink: #06231a;
      --blue: #6fb3ff; --warn: #ffb454; --bad: #ff6b6b; --on-bad: #2a0606;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--sans); padding-inline: 16px; padding-block: 0 72px; }
  .page { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .page > * { min-width: 0; }
  header.top { padding-block: 24px 0; }
  .kicker { color: var(--accent); font: 600 13px var(--mono); letter-spacing: 1.5px; text-transform: uppercase; }
  h1 { font-size: 30px; line-height: 1.15; margin: 4px 0 8px; text-wrap: balance; }
  h2.section { font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin: 14px 0 0; }
  .lede { color: var(--dim); margin: 0; }
  a { color: var(--blue); }
  code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font: 0.92em var(--mono); overflow-wrap: anywhere; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 14.5px/1.5 var(--mono); margin: 10px 0; white-space: pre; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 16px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .card.try { border-left: 4px solid var(--warn); }
  .card.task { border-left: 4px solid var(--accent); }
  .card.predict { border-left: 4px solid var(--blue); }
  .tag { font: 600 12px var(--mono); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .try .tag { color: var(--warn); } .task .tag { color: var(--accent); } .predict .tag { color: var(--blue); }
  .muted { color: var(--dim); font-size: 14.5px; }
  .good { color: var(--accent); font-weight: 600; margin-top: 8px; }
  ol, ul { padding-left: 22px; margin: 8px 0; }
  textarea { width: 100%; min-height: 84px; background: var(--code); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 15px var(--mono); resize: vertical; }
  details.card summary { cursor: pointer; font-weight: 600; }
  details.card[open] summary { margin-bottom: 8px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list a { display: flex; gap: 12px; align-items: baseline; text-decoration: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .list a .n { font: 600 14px var(--mono); color: var(--accent); flex: none; width: 20px; }
  .list a b { display: block; line-height: 1.3; }
  .list a span.s { color: var(--dim); font-size: 14px; }
  a.planlink { display: grid; gap: 4px; text-decoration: none; color: var(--text); border-left: 4px solid var(--accent); }
  a.planlink .s { color: var(--dim); font-size: 14.5px; }
  a.planlink .more { color: var(--blue); font-weight: 600; font-size: 15px; margin-top: 4px; }
  .markscard { display: grid; gap: 8px; border-left: 4px solid var(--blue); }
  .markscard .counts { color: var(--dim); font-size: 15px; }
  a.sendbtn { display: inline-block; text-decoration: none; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; padding: 9px 16px; font-weight: 600; }
  .markrow { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
  .markrow:first-of-type { border-top: 0; }
  .markrow .where { font-size: 14px; color: var(--dim); }
  .markrow .where a { font-weight: 600; }
  .markrow .state { font: 12px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .markrow .state.wait { color: var(--warn); }
  .markrow button { justify-self: start; padding: 4px 12px; font-size: 14px; }
  .list a .readtick { margin-left: auto; flex: none; }
  .bar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-block: 16px 0; }
  .bar a { text-decoration: none; font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .stack > * { min-width: 0; }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script src="week1-game.js"></script>
<script src="notes.js"></script>
<script src="plan.js"></script>
<script src="math-data.js"></script>
<script src="widgets.js"></script>
<script src="math.js"></script>
<script>
(function () {
  const WEEK = window.WEEK, NOTES = window.NOTES || [], app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  const clean = s => s.replace(/\r/g, '').split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== '');
  const answered = {};   // predictions made on this visit
  const CONCEPTS = NOTES.filter(n => n.kind === 'concept').sort((a, b) => a.order - b.order);
  const PAYMENTS = NOTES.filter(n => n.kind === 'payments').sort((a, b) => a.order - b.order);
  const ASKED = NOTES.filter(n => n.kind !== 'concept' && n.kind !== 'payments');
  const PLAN = window.PLAN;
  const MATHS = (window.MATH ? window.MATH.modules : []).slice().sort((a, b) => a.order - b.order);
  const MARKS = Lab.marks;
  const PKEY = 'lab-marks-pending';
  const titleOf = id => { const m = WEEK.missions.find(x => x.id === id); if (m) return 'Lesson: ' + m.title; const n = NOTES.find(x => x.id === id); if (n) return n.title; const mm = MATHS.find(x => x.id === id); return mm ? 'Maths: ' + mm.title : id; };
  const mem = {};
  function sget(k) { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return mem[k] || null; } }
  function sset(k, v) { mem[k] = v; try { if (v) sessionStorage.setItem(k, JSON.stringify(v)); else sessionStorage.removeItem(k); } catch (e) { /* kept in memory for this visit */ } }
  const readTick = id => MARKS.isRead(id) ? '<span class="readtick" title="Marked as read">&#10003;</span>' : '';

  // The card on the home page: what has been marked, and the Send button.
  function marksCard() {
    const card = el('div', 'card markscard');
    function draw() {
      const c = MARKS.counts(), sends = MARKS.sends(new Date()), pending = sget(PKEY), seq = sget(PKEY + '-seq');
      card.innerHTML = '';
      card.append(el('div', 'kicker', 'My marks'));
      card.append(el('div', 'counts', (c.rounds ? c.rounds + ' drill round' + (c.rounds === 1 ? '' : 's') + ' · ' : '') + c.read + ' read · ' + c.questions + ' question' + (c.questions === 1 ? '' : 's') + ' · ' + c.tags + ' tag' + (c.tags === 1 ? '' : 's') + ' · check yourself: ' + c.got + ' got, ' + c.missed + ' missed'));
      if (pending && pending.keys && pending.keys.length && c.unsent > 0) {
        card.append(el('div', '', '<b>Did you press Submit on GitHub?</b>'));
        const row = el('div', 'wrow');
        const yes = el('button', 'primary', 'Yes, sent'); yes.type = 'button';
        yes.addEventListener('click', () => { MARKS.markSent(pending.keys); sset(PKEY + '-seq', pending.part < pending.total ? { part: pending.part, total: pending.total } : null); sset(PKEY, null); draw(); });
        const no = el('button', '', 'Not yet'); no.type = 'button';
        no.addEventListener('click', () => { sset(PKEY, null); draw(); });
        row.append(yes, no);
        card.append(row);
      } else if (sends.length) {
        if (pending) sset(PKEY, null);
        const follows = seq && seq.total - seq.part === sends.length;
        const part = follows ? seq.part + 1 : 1, total = follows ? seq.total : sends.length;
        if (seq && !follows) sset(PKEY + '-seq', null);
        const a = el('a', 'sendbtn', esc(total > 1 ? 'Send part ' + part + ' of ' + total + ' to tutor (' + sends[0].count + ')' : 'Send to tutor (' + sends[0].count + ')'));
        a.href = sends[0].url; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', () => { sset(PKEY, { keys: sends[0].keys, part, total }); setTimeout(draw, 400); });
        const row = el('div'); row.append(a);
        card.append(row);
      } else {
        if (pending) sset(PKEY, null);
        if (seq) sset(PKEY + '-seq', null);
        card.append(el('div', 'muted', c.read + c.questions + c.tags + c.got + c.missed + c.rounds === 0 ? 'Nothing marked yet. Open a note and use "Mark this section" under any heading, or "Mark as read" at the end.' : 'Everything has been sent.'));
      }
      card.append(el('div', 'muted', 'Send opens GitHub in a new tab with your marks filled in. Press Submit there. You need to be signed in to GitHub in this browser. The inbox is private. <a href="#marks">See everything I marked</a>'));
    }
    draw();
    // Coming back from the GitHub tab: show the "did you press Submit?" question straight away.
    const back = () => { if (!card.isConnected) { document.removeEventListener('visibilitychange', back); window.removeEventListener('focus', back); return; } if (document.visibilityState === 'visible') draw(); };
    document.addEventListener('visibilitychange', back);
    window.addEventListener('focus', back);
    return card;
  }

  // Everything marked, with remove buttons.
  function marksPage() {
    app.innerHTML = '';
    app.append(bar());
    const top = el('header');
    top.append(el('div', 'kicker', 'My marks'), el('h1', '', 'Everything I marked'));
    app.append(top);
    const d = MARKS.data(), card = el('div', 'card');
    const row = (key, whereHtml, bodyHtml, sent) => {
      const r = el('div', 'markrow');
      r.append(el('div', 'where', whereHtml));
      if (bodyHtml) r.append(el('div', '', bodyHtml));
      r.append(el('div', 'state' + (sent ? '' : ' wait'), sent ? 'Sent' : 'Not sent yet'));
      const rm = el('button', '', 'Remove'); rm.type = 'button';
      rm.addEventListener('click', () => { MARKS.remove(key); marksPage(); });
      r.append(rm);
      card.append(r);
    };
    const link = id => '<a href="#' + id + '">' + esc(titleOf(id)) + '</a>';
    let n = 0;
    Object.keys(d.marks).forEach(k => { const m = d.marks[k]; n++; row('m:' + k, link(m.note) + ' · ' + esc(m.title), m.tags.map(t => '<span class="markchip on">' + esc(MARKS.tagLabel(t)) + '</span>').join(' ') + (m.text ? '<div>' + esc(m.text) + '</div>' : ''), m.sent); });
    Object.keys(d.checks).forEach(note => Object.keys(d.checks[note]).forEach(q => { const c = d.checks[note][q]; n++; row('c:' + note + ':' + q, link(note) + ' · check yourself, question ' + (Number(q) + 1), c.r === 'got' ? 'Got it' : 'Missed it', c.sent); }));
    Object.keys(d.read).forEach(id => { n++; row('r:' + id, link(id), 'Marked as read', d.read[id].sent); });
    (d.rounds || []).slice().reverse().forEach(r => { n++; const dr = LabMath.DRILLS[r.drill]; row('d:' + r.id, 'Maths drill · ' + esc(dr ? dr.title : r.drill) + ' · level ' + r.level, r.score + ' / ' + r.of + ' in ' + r.time + ' seconds', r.sent); });
    if (!n) card.append(el('div', 'muted', 'Nothing marked yet.'));
    app.append(card, bar());
  }


  function home() {
    app.innerHTML = '';
    const top = el('header', 'top');
    top.append(el('div', 'kicker', 'Engineering Lab'), el('h1', '', 'Lessons and notes'),
      el('p', 'lede', 'For a break or for revising at the laptop. The diagrams, predictions and maths drills work here. The programming is done in the lab on the computer.'));
    app.append(top);
    if (PLAN) {
      const first = PLAN.targets[0];
      const box = el('a', 'card planlink');
      box.href = '#plan';
      box.innerHTML = '<span class="kicker">Plan · ' + esc(PLAN.week.title) + '</span><b>' + esc(first.by) + '</b><span class="s">' + first.items.map(i => esc(i.text)).join(' · ') + '</span><span class="more">Open the full plan and roadmap</span>';
      app.append(box);
    }
    app.append(marksCard());
    app.append(el('h2', 'section', esc(WEEK.title)));
    const lessons = el('nav', 'list'); lessons.setAttribute('aria-label', 'Lessons');
    WEEK.missions.forEach((m, i) => {
      const a = el('a', '', '<span class="n">' + (i + 1) + '</span><span><b>' + esc(m.title) + '</b><span class="s">' + esc(m.skill) + '</span></span>' + readTick(m.id));
      a.href = '#' + m.id; lessons.append(a);
    });
    app.append(lessons);
    if (MATHS.length) {
      app.append(el('h2', 'section', 'Maths: practise on a break'));
      const nav = el('nav', 'list'); nav.setAttribute('aria-label', 'Maths');
      MATHS.forEach((m, i) => {
        const sum = LabMath.summary(m);
        const state = sum.locked === sum.drills ? 'All ' + sum.drills + ' drills locked in' : sum.locked ? sum.locked + ' of ' + sum.drills + ' drills locked in' : sum.started ? 'Started · ' + sum.drills + ' drills' : sum.drills + ' drills · ' + m.where;
        const a = el('a', '', '<span class="n">' + (i + 1) + '</span><span><b>' + esc(m.title) + '</b><span class="s">' + esc(state) + '</span></span>' + readTick(m.id));
        a.href = '#' + m.id; nav.append(a);
      });
      app.append(nav);
    }
    [['Concept notes: revise a topic', CONCEPTS, 'Goes with lesson '], ['Payments: how money moves', PAYMENTS, 'Payments note '], ['Questions I asked', ASKED, '']].forEach(([title, items, numbered]) => {
      app.append(el('h2', 'section', title));
      const nav = el('nav', 'list'); nav.setAttribute('aria-label', title);
      items.forEach((n, i) => {
        const a = el('a', '', (numbered ? '<span class="n">' + (i + 1) + '</span>' : '') + '<span><b>' + esc(n.title) + '</b><span class="s">' + esc(numbered ? numbered + (i + 1) : n.date) + '</span></span>' + readTick(n.id));
        a.href = '#' + n.id; nav.append(a);
      });
      if (!items.length) nav.append(el('div', 'card', 'Nothing here yet.'));
      app.append(nav);
    });
  }

  function bar(prev, next) {
    const b = el('div', 'bar');
    b.append(el('span', '', '<a href="#home">All lessons and notes</a>'));
    const right = el('span');
    if (prev) right.innerHTML += '<a href="#' + prev.id + '">Previous</a>';
    if (prev && next) right.innerHTML += ' &nbsp;·&nbsp; ';
    if (next) right.innerHTML += '<a href="#' + next.id + '">Next</a>';
    b.append(right);
    return b;
  }

  function predict(m, i, b) {
    const key = m.id + ':' + i, card = el('div', 'card predict');
    function draw() {
      card.innerHTML = '';
      card.append(el('div', 'tag', 'Predict'), el('div', '', 'What does this print? Work it out in your head.'), el('pre', '', esc(b.code)));
      if (!(key in answered)) {
        const ta = el('textarea'); ta.id = 'p-' + m.id + '-' + i; ta.setAttribute('aria-label', 'Your prediction'); ta.placeholder = 'Type exactly what you think appears on the screen';
        const go = el('button', 'primary', 'Lock in my answer'); go.type = 'button';
        go.addEventListener('click', () => { if (!ta.value.trim()) return; answered[key] = ta.value.trim(); draw(); });
        const row = el('div'); row.style.marginTop = '10px'; row.append(go);
        card.append(ta, row);
      } else {
        const right = clean(answered[key]).join('\n') === clean(b.answer).join('\n');
        card.append(el('div', 'muted', 'You said'), el('pre', '', esc(answered[key])), el('div', 'muted', 'It prints'), el('pre', '', esc(b.answer)));
        card.append(el('div', right ? 'good' : 'muted', right ? 'Correct.' : 'Not this time. The walk-through below shows where it went differently.'));
      }
    }
    draw();
    return card;
  }

  function lesson(m) {
    const idx = WEEK.missions.indexOf(m);
    app.innerHTML = '';
    app.append(bar(WEEK.missions[idx - 1], WEEK.missions[idx + 1]));
    const top = el('header');
    top.append(el('div', 'kicker', 'Lesson ' + (idx + 1) + ' of ' + WEEK.missions.length + ' · ' + esc(m.skill)), el('h1', '', esc(m.title)));
    app.append(top);
    const body = el('div', 'stack');
    m.blocks.forEach((b, i) => {
      if (b.t === 'say') body.append(el('div', '', b.html));
      else if (b.t === 'code') body.append(el('pre', '', esc(b.code)));
      else if (b.t === 'stepper') body.append(Lab.stepper(b, m.id + ':' + i));
      else if (b.t === 'callstack') body.append(Lab.callstack(b, m.id + ':' + i));
      else if (b.t === 'predict') body.append(predict(m, i, b));
      else if (b.t === 'deeper') { const d = el('details', 'card'); d.append(el('summary', '', 'Go deeper: ' + esc(b.title)), el('div', '', b.html)); body.append(d); }
      else if (b.t === 'try' || b.t === 'run') { const c = el('div', 'card try'); c.append(el('div', 'tag', 'Experiment · on your computer'), el('div', '', b.html)); body.append(c); }
      else if (b.t === 'task') {
        const c = el('div', 'card task');
        c.append(el('div', 'tag', (b.timed ? 'Timed challenge' : 'Build') + ' · on your computer'));
        c.append(el('div', '', b.timed ? 'This one is against the clock. The problem is shown in the lab when you start the timer, so it is not printed here.' : b.html));
        body.append(c);
      }
    });
    const concept = CONCEPTS.find(n => n.lesson === m.id);
    if (concept) body.append(el('div', 'card', 'To revise this topic later: <a href="#' + concept.id + '">' + esc(concept.title) + '</a>'));
    const tools = el('div', 'card'); tools.append(MARKS.pageTools(m.id, m.title)); body.append(tools);
    app.append(body);
    Lab.hydrate(body, {});
    app.append(bar(WEEK.missions[idx - 1], WEEK.missions[idx + 1]));
  }

  function note(n) {
    const group = n.kind === 'concept' ? CONCEPTS : n.kind === 'payments' ? PAYMENTS : ASKED, idx = group.indexOf(n);
    app.innerHTML = '';
    app.append(bar(group[idx - 1], group[idx + 1]));
    const body = el('div', 'stack');
    body.append(Lab.noteCard(n, {}));
    app.append(body);
    app.append(bar(group[idx - 1], group[idx + 1]));
  }

  function maths(m) {
    const idx = MATHS.indexOf(m);
    app.innerHTML = '';
    app.append(bar(MATHS[idx - 1], MATHS[idx + 1]));
    app.append(LabMath.modulePage(m, {}));
    app.append(bar(MATHS[idx - 1], MATHS[idx + 1]));
  }

  function plan() {
    app.innerHTML = '';
    app.append(bar());
    const top = el('header');
    top.append(el('div', 'kicker', 'Plan'), el('h1', '', 'What to finish, and when'));
    app.append(top, Lab.planView(PLAN));
    app.append(bar());
  }

  function route() {
    const id = location.hash.slice(1);
    const m = WEEK.missions.find(x => x.id === id), n = NOTES.find(x => x.id === id), mm = MATHS.find(x => x.id === id);
    if (id === 'plan' && PLAN) plan(); else if (id === 'marks') marksPage(); else if (m) lesson(m); else if (n) note(n); else if (mm) maths(mm); else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
